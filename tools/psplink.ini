# pluser=[0 1] Enable the PSPLink user module
pluser=0

# resetonexit=[0 1] Reset psplink when sceKernelExitGame is called.
#
# ZERO, deliberately. A reset re-runs PSPLINK's large-memory bootstrap, which
# consumes memory partition 11 (extVshell). Without partition 11 the firmware
# saves 4 MB of Media Engine eDRAM to 0x08800000 on every standby -- the base
# of user memory -- and destroys whatever module is loaded there. With this at
# 1, every sleep test after the first load of a session is invalid.
resetonexit=0
